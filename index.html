let cur = 0;
const st = {};
function cl(s){return esc(s.replace(/^(Correto|Errado):\s*/,'').replace(/^./,c=>c.toUpperCase()));}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function init(){
  const nv=document.getElementById('nv'), qs=document.getElementById('qs');
  QUESTOES.forEach((q,i)=>{
    const b=document.createElement('button'); b.textContent=q.num; b.onclick=()=>go(i); nv.appendChild(b);
    qs.appendChild(bc(q,i));
  });
  go(0); us();
}
function bc(q,i){
  const d=document.createElement('div'); d.className='qc'; d.id='q'+i;
  let h='<div class="qh"><span class="qtag">Questão '+q.num+'</span><span class="qex">'+esc(q.exame)+'</span></div>';
  h+='<div class="qt">'+esc(q.titulo)+'</div>';
  h+='<div class="en">'+esc(q.enunciado)+'</div><div class="cm">'+esc(q.comando)+'</div>';
  ['A','B','C','D'].forEach(l=>{
    h+='<button class="alt" data-l="'+l+'" onclick="resp('+i+',\''+l+'\')"><span class="lt">'+l+'</span><span>'+esc(q.alternativas[l])+'</span></button>';
  });
  h+='<div class="fb" id="fb'+i+'"></div>';
  h+='<div class="acts" id="ac'+i+'"><button class="b1" onclick="tF('+i+')">Ver fundamento legal</button>';
  h+='<button class="b2" onclick="tX('+i+')">Explicação do Prof. Caqui</button>';
  h+='<button class="b3" onclick="rst('+i+')">↺ Tentar novamente</button>';
  h+='<span class="gab">Gabarito: <b>'+q.gabarito+'</b></span></div>';
  h+='<div class="fu" id="fu'+i+'"><h4>📖 Fundamento legal</h4>'+esc(q.fundamento)+'</div>';
  h+='<div class="ca" id="ca'+i+'"><h4>🍊 Explicação didática do Professor Caqui</h4>'+esc(q.caqui)+'</div>';
  d.innerHTML=h; return d;
}
function resp(i,l){
  if(st[i]) return;
  const q=QUESTOES[i], ok=l===q.gabarito; st[i]=ok?'ok':'no';
  document.querySelectorAll('#q'+i+' .alt').forEach(b=>{
    b.disabled=true;
    if(b.dataset.l===q.gabarito) b.classList.add('cor');
    else if(b.dataset.l===l) b.classList.add('err');
  });
  const fb=document.getElementById('fb'+i);
  fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=(ok?'<b>✓ Correto!</b> ':'<b>✗ Incorreto.</b> ')+cl(q.feedbacks[l])+(ok?'':' <br><b>Gabarito: '+q.gabarito+'</b> — '+cl(q.feedbacks[q.gabarito]));
  document.getElementById('ac'+i).classList.add('on');
  nav(); us();
}
function tF(i){document.getElementById('fu'+i).classList.toggle('on');}
function tX(i){document.getElementById('ca'+i).classList.toggle('on');}
function rst(i){
  delete st[i];
  document.querySelectorAll('#q'+i+' .alt').forEach(b=>{b.disabled=false;b.classList.remove('cor','err');});
  document.getElementById('fb'+i).className='fb';
  document.getElementById('ac'+i).classList.remove('on');
  document.getElementById('fu'+i).classList.remove('on');
  document.getElementById('ca'+i).classList.remove('on');
  nav(); us();
}
function go(i){
  if(i<0||i>=QUESTOES.length) return;
  document.querySelectorAll('.qc').forEach(e=>e.classList.remove('vis'));
  document.getElementById('q'+i).classList.add('vis');
  cur=i; nav(); upd();
}
function nav(){
  document.querySelectorAll('#nv button').forEach((b,i)=>{
    b.className=(i===cur?'act ':'')+(st[i]||'');
  });
}
function upd(){
  document.getElementById('pi').textContent=(cur+1)+' de '+QUESTOES.length;
  document.getElementById('bp').disabled=cur===0;
  document.getElementById('bn').disabled=cur===QUESTOES.length-1;
}
function us(){
  const v=Object.values(st), a=v.filter(x=>x==='ok').length, n=QUESTOES.length;
  document.getElementById('sR').textContent=v.length;
  document.getElementById('sA').textContent=a;
  document.getElementById('sE').textContent=v.length-a;
  document.getElementById('pb').style.width=(v.length/n*100)+'%';
  document.getElementById('pt').textContent=v.length+' de '+n+' respondidas';
}
init();
</script>
